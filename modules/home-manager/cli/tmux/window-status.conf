# Glyph-heavy tmux formats, sourced verbatim from tmux.nix to keep the
# Nerd Font per-command icons byte-intact. Colors are literal Tokyo Night
# hex (kept inline here because the icons must not be re-encoded).
set -g automatic-rename-format "#{?pane_in_mode,[tmux],#{?#{m:*claude*,#{pane_current_command}},#{?#{==:#{pane_title},},claude,#{=/24/…:#{s/^[^ ]+ //:pane_title}}},#{pane_current_command}}}#{?pane_dead,[dead],}"
set -g window-status-format         "#{?@claude_waiting,#[fg=#1f2335#,bg=#f7768e#,bold],#[fg=#565f89]} #I #W #[default]"
set -g window-status-current-format "#{?@claude_waiting,#[fg=#1f2335#,bg=#f7768e#,bold],#[fg=#7dcfff#,bold]} #I #W #[default]"
